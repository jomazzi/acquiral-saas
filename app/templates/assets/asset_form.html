{% extends "base.html" %}
{% block title %}New Asset{% endblock %}
{% block content %}
<h3 class="mb-3">New Fixed Asset</h3>
<div class="card card-metric p-4" style="max-width: 620px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Asset name</label>
      <input type="text" name="name" class="form-control" placeholder="e.g. Toyota Hilux, HP Laptop" required>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Category</label>
        <select name="category" class="form-select" required>
          {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Project (if grant-funded)</label>
        <select name="project_id" class="form-select">
          <option value="">— Organisation asset —</option>
          {% for p in projects %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Cost (₦)</label>
        <input type="number" step="0.01" name="cost" class="form-control" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Salvage value (₦)</label>
        <input type="number" step="0.01" name="salvage_value" class="form-control" value="0">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Useful life (years)</label>
        <input type="number" name="useful_life_years" class="form-control" value="5" required>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Acquisition date</label>
        <input type="date" name="acquisition_date" class="form-control" value="{{ today }}" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Serial / asset tag no.</label>
        <input type="text" name="serial_number" class="form-control">
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Custodian</label>
        <input type="text" name="custodian" class="form-control" placeholder="Staff responsible">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" placeholder="e.g. Port Harcourt office">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Cost is recorded in ₦ (Naira) regardless of which account pays for it.</label>
    </div>
    <div class="mb-3">
      <label class="form-label">Record purchase in the ledger — paid from</label>
      <select name="paid_from" class="form-select" id="paid-from-select">
        <option value="none">No — just add to the asset register</option>
        {% for a in bank_accounts %}
        <option value="{{ a.id }}" data-currency="{{ a.currency }}">{{ a.code }} {{ a.name }} {% if a.currency != 'NGN' %}({{ a.currency }}){% endif %}</option>
        {% endfor %}
        <option value="payable">On credit (Accounts Payable)</option>
      </select>
    </div>
    <div class="mb-3" id="asset-rate-wrap" style="display:none;">
      <label class="form-label">Exchange rate (→₦)</label>
      <input type="number" step="0.0001" name="exchange_rate" class="form-control" id="asset-rate-input">
      <div class="small text-muted">The Naira cost above will be converted to that account's currency at this rate for the ledger entry.</div>
    </div>
    <button class="btn btn-primary">Save Asset</button>
  </form>
</div>
<script>
document.getElementById('paid-from-select').addEventListener('change', function() {
  const opt = this.options[this.selectedIndex];
  const cur = opt ? opt.getAttribute('data-currency') : null;
  document.getElementById('asset-rate-wrap').style.display = (cur && cur !== 'NGN') ? '' : 'none';
});
</script>
{% endblock %}
