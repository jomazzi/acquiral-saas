{% extends "base.html" %}
{% block title %}New Bill{% endblock %}
{% block content %}
<h3 class="mb-3">New Bill</h3>

<form method="post" class="card card-metric p-4">
  <div class="row mb-3">
    <div class="col-md-4">
      <label class="form-label small">Vendor</label>
      <select name="vendor_id" class="form-select" required>
        <option value=""></option>
        {% for v in vendors %}<option value="{{ v.id }}">{{ v.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label small">Bill Date</label>
      <input type="date" name="bill_date" class="form-control" value="{{ today }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label small">Due Date</label>
      <input type="date" name="due_date" class="form-control">
    </div>
    <div class="col-md-2">
      <label class="form-label small">Reference</label>
      <input type="text" name="reference" class="form-control" placeholder="Vendor's inv. no.">
    </div>
  </div>

  <table class="table table-sm" id="lines-table">
    <thead>
      <tr>
        <th style="width:20%">Category</th>
        <th style="width:55%">Description</th>
        <th style="width:25%">Amount</th>
      </tr>
    </thead>
    <tbody id="lines-body">
      {% for i in range(3) %}
      <tr>
        <td>
          <select name="account_id[]" class="form-select form-select-sm">
            <option value=""></option>
            {% for a in expense_accounts %}<option value="{{ a.id }}">{{ a.code }} {{ a.name }}</option>{% endfor %}
          </select>
        </td>
        <td><input type="text" name="description[]" class="form-control form-control-sm"></td>
        <td><input type="number" step="0.01" name="amount[]" class="form-control form-control-sm amount-input"></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <button type="button" class="btn btn-sm btn-outline-secondary" id="add-line">+ Add line</button>
    <div class="text-end">
      <div class="fs-6">Total: <strong id="grand-total">₦0.00</strong></div>
    </div>
  </div>

  <div class="mb-3">
    <label class="form-label small">Notes</label>
    <textarea name="notes" class="form-control" rows="2" placeholder="Internal notes (not shown to the vendor)"></textarea>
  </div>

  <button class="btn btn-primary">Create Draft Bill</button>
</form>

<script>
function recalc() {
  let total = 0;
  document.querySelectorAll('.amount-input').forEach(input => {
    total += parseFloat(input.value || 0);
  });
  document.getElementById('grand-total').textContent = '₦' + total.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
document.getElementById('lines-body').addEventListener('input', recalc);

document.getElementById('add-line').addEventListener('click', function() {
  const body = document.getElementById('lines-body');
  const row = body.rows[0].cloneNode(true);
  row.querySelectorAll('input').forEach(i => { i.value = ''; });
  row.querySelector('select').value = '';
  body.appendChild(row);
});
recalc();
</script>
{% endblock %}
