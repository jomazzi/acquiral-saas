{% extends "base.html" %}
{% block title %}New Account{% endblock %}
{% block content %}
<h3 class="mb-3">New Account</h3>
<div class="card card-metric p-4" style="max-width: 480px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Code</label>
      <input type="text" name="code" class="form-control" placeholder="e.g. 5950" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Type</label>
      <select name="type" class="form-select" required>
        {% for t in types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
      </select>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Currency</label>
        <select name="currency" class="form-select">
          {% for code, info in currencies.items() %}
          <option value="{{ code }}" {% if code == 'NGN' %}selected{% endif %}>{{ code }} — {{ info.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6 mb-3 form-check ms-1 mt-4 pt-2">
        <input type="checkbox" name="is_cash_or_bank" class="form-check-input" id="is_cash_or_bank">
        <label class="form-check-label" for="is_cash_or_bank">This is a cash/bank account</label>
        <div class="small text-muted">Makes it available as a "pay from" account for payroll and asset purchases, and included in the dashboard's cash position.</div>
      </div>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" name="contra" class="form-check-input" id="contra">
      <label class="form-check-label" for="contra">Contra account (e.g. Accumulated Depreciation) — carries the opposite normal balance to its type</label>
    </div>
    <button class="btn btn-primary">Save Account</button>
  </form>
</div>
{% endblock %}
