<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password — {{ app_name }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: var(--navy-900); min-height:100vh;" class="d-flex align-items-center py-5">
  <div class="container"><div class="row justify-content-center"><div class="col-md-5">
    <div class="card p-4 shadow-lg border-0" style="border-radius: 14px;">
      <h5 class="mb-3">Choose a new password</h5>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}<div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">{{ msg }}</div>{% endfor %}
      {% endwith %}
      <p class="text-muted small">For username <strong>{{ username }}</strong>.</p>
      <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
        <input type="password" name="password" class="form-control mb-3" required minlength="6" autofocus>
        <button class="btn btn-primary w-100">Save password</button>
      </form>
    </div>
  </div></div></div>
</body>
</html>
